name: Extras Live Provider Smoke (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-provider-checks:
    name: Live TMDB and AniList API checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify protected TMDB credentials are configured
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$TMDB_API_KEY" ]]; then
            echo "BLOCKED: configure TMDB_API_KEY as a repository secret to run live checks." >&2
            exit 1
          fi

      - name: Test public provider API flows without exposing data
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          bash tools/ci/test_extras_live_apis.sh

name: Finalize Anime UI and request debug APKs once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-anime-debug-once.yml"

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  cleanup-and-debug:
    if: github.repository == 'Vaydelux/Bousygram' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify merged PR, prune reviewed topic branch and dispatch debug release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/172" --jq '.merged')" == true ]] || {
            echo "::error::PR #172 is not merged; refusing cleanup"
            exit 1
          }
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::Main moved during finalize; refusing an older build"
            exit 1
          }
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            case "$branch" in
              main) ;;
              fix/anime-embed-premium-theme-20261111)
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
                echo "Removed merged feature branch: $branch"
                ;;
              *) echo "::error::Unexpected branch $branch; refusing cleanup"; exit 1 ;;
            esac
          done
          [[ "$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')" == main ]] || exit 1
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/android-debug-prerelease.yml/dispatches" --raw-field ref=main
          echo "Only main remains. Requested debug APK prerelease for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

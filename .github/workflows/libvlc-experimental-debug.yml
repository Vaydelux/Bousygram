name: LibVLC Experimental Debug Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/libvlc-experimental-debug.yml'
      - 'app/build.gradle.kts'
      - 'app/src/libvlcExperimental/**'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/PlayerEngineFactory.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/ExperimentalStreamUrlPolicy.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/data/store/EnterprisePreferences.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libvlc-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experimental-abi:
    name: Experimental LibVLC ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK dependencies
        run: bash tools/ci/setup_android_sdk.sh

      - name: Compile, run JVM tests and assemble opt-in native APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            -PenableExperimentalLibVlc=true -PdevAbi=${{ matrix.abi }} \
            :app:verifyTdlibBindingCompatibility \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Verify both TDLib and LibVLC native ABI libraries
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/libvlc-apk-files.txt"
          grep -qx "lib/${{ matrix.abi }}/libtdjni.so" "$RUNNER_TEMP/libvlc-apk-files.txt"
          grep -qx "lib/${{ matrix.abi }}/libvlc.so" "$RUNNER_TEMP/libvlc-apk-files.txt"
          grep -qx "lib/${{ matrix.abi }}/libc++_shared.so" "$RUNNER_TEMP/libvlc-apk-files.txt"
          sha256sum "$apk"
          echo "Opt-in lab APK only: not a production or default debug release"

      - name: Archive experimental APK for device trials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libvlc-lab-${{ matrix.abi }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

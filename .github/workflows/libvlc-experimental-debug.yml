name: LibVLC Integrated ABI Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/libvlc-experimental-debug.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/LibVlcPlayerEngine.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/PlaybackEngineOwner.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/PlaybackEngineSwitchCoordinator.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/AccountMediaResources.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/PlayerThreadDispatchPolicy.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/PlayerEngineFactory.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/ExperimentalStreamUrlPolicy.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/data/store/EnterprisePreferences.kt'
  pull_request:
    paths:
      - '.github/workflows/libvlc-experimental-debug.yml'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/PlaybackEngineOwner.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/PlaybackEngineSwitchCoordinator.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/AccountMediaResources.kt'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/PlayerThreadDispatchPolicy.kt'
      - 'app/src/test/java/com/vaydelux/bousygram/core/media/PlaybackEngineOwnerTest.kt'
      - 'app/src/test/java/com/vaydelux/bousygram/core/media/PlayerThreadDispatchPolicyTest.kt'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/vaydelux/bousygram/presentation/extras/**'
      - 'app/src/androidTest/java/com/vaydelux/bousygram/presentation/extras/**'
      - 'mediaforge-core/**'
      - 'mediaforge-webbridge/**'
      - 'mediaforge-player-adapters/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libvlc-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libvlc-abi:
    name: Official LibVLC ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - name: Check out exact branch/PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK dependencies
        run: bash tools/ci/setup_android_sdk.sh

      - name: Refuse manually dispatched debug builds outside main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo '::error::Credentialed Android debug builds must be dispatched from main.' >&2
          exit 1

      # Never expose the TMDB secret to PR-triggered builds; Android APKs
      # contain any BuildConfig API key in extractable form.
      - name: Configure TMDB v3 API key for trusted debug builds
        if: ${{ github.ref == 'refs/heads/main' && github.repository == 'Vaydelux/Bousygram' }}
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          # Trusted APKs must never silently ship an empty or placeholder
          # credential. Verify the v3 API key without printing its value.
          if [[ ! "$TMDB_API_KEY" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "::error::Trusted debug APK requires a TMDB_API_KEY secret containing a 32-character TMDB v3 API key."
            exit 1
          fi
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > .env
          chmod 600 .env

      - name: Verify standard debug APK with LibVLC
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            -PdevAbi=${{ matrix.abi }} \
            :app:verifyTdlibBindingCompatibility \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Verify both TDLib and LibVLC native ABI libraries
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/libvlc-apk-files.txt"
          grep -qx "lib/${{ matrix.abi }}/libtdjni.so" "$RUNNER_TEMP/libvlc-apk-files.txt"
          grep -qx "lib/${{ matrix.abi }}/libvlc.so" "$RUNNER_TEMP/libvlc-apk-files.txt"
          grep -qx "lib/${{ matrix.abi }}/libmpv.so" "$RUNNER_TEMP/libvlc-apk-files.txt"
          grep -qx "lib/${{ matrix.abi }}/libc++_shared.so" "$RUNNER_TEMP/libvlc-apk-files.txt"
          sha256sum "$apk"
          echo "Standard APK with LibVLC; native device qualification still required"

      - name: Archive standard ABI APK with LibVLC
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libvlc-standard-${{ matrix.abi }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

name: Publish qualified Cast Lab dated QA prerelease
on:
  push:
    branches: [feature/v1.1-cast-handoff]
    paths: [.github/workflows/cast-lab-dated-qa-release.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cast-lab-qa-85788f7
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Vaydelux/Bousygram' && github.ref == 'refs/heads/feature/v1.1-cast-handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QA_HEAD: 85788f7a24ce61fa0f565b4474cc86bd9fe872f8
      QA_BASE: 91167aff74ac0c58259c6f67f371083bbf7ff488
      QA_MERGE: 0d99273cf0a43778a4104495d2c74aa60e7824d7
      QA_RUN: '45771994026'
      QA_ARTIFACT: '15093899912'
      QA_DIGEST: 9c36000b36f71fbbd8fcfd90db06e99058733337e8f25f21240b5c374e5a0f90
      QA_TAG: debug-cast-lab-20261126-85788f7
    steps:
      - name: Validate original qualified source and artifact
        shell: bash
        run: |
          set -euo pipefail
          # The nested pull_requests head is live metadata, not the historical run SHA.
          # Verify the immutable run and the exact merge proof recorded by its jobs.
          for run_id in "$QA_RUN" 45771994015 45771993944 45771994049; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" | jq -e --arg head "$QA_HEAD" \
              '.head_sha == $head and .event == "pull_request" and .status == "completed" and .conclusion == "success" and .run_attempt == 1' >/dev/null || { echo "::error::Invalid original qualification run $run_id"; exit 1; }
            if [[ "$run_id" != "$QA_RUN" ]]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/1/jobs?per_page=100" | jq -e --arg proof "Prove tested merge $QA_MERGE" \
                '.total_count > 0 and (.jobs | length > 0 and all(.[]; .conclusion == "success" and any(.steps[]?; .name == $proof and .conclusion == "success")))' >/dev/null || { echo "::error::Missing exact merge proof in $run_id"; exit 1; }
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$QA_MERGE" | jq -e --arg base "$QA_BASE" --arg head "$QA_HEAD" \
            '(.parents | map(.sha)) == [$base, $head]' >/dev/null || { echo "::error::Tested merge parents differ"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN/artifacts?per_page=100" | jq -e --arg head "$QA_HEAD" --arg digest "sha256:$QA_DIGEST" --argjson id "$QA_ARTIFACT" \
            '[.artifacts[] | select(.id == $id and .expired == false and .digest == $digest and .name == ("cast-lab-qa-" + $head))] | length == 1' >/dev/null || { echo "::error::Original artifact metadata differs"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$QA_ARTIFACT/zip" > qa.zip
          printf '%s  qa.zip\n' "$QA_DIGEST" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          expected = {"Bousygram-Cast-Lab-debug.apk", "BUILD_INFO.txt", "SHA256SUMS.txt", "README.txt"}
          with ZipFile("qa.zip") as archive:
              names = archive.namelist()
              assert len(names) == len(expected) and set(names) == expected
              output = Path("qa")
              output.mkdir()
              for name in names:
                  assert not archive.getinfo(name).is_dir()
                  with archive.open(name) as source, (output / name).open("wb") as target:
                      import shutil
                      shutil.copyfileobj(source, target)
          PY
          cd qa
          printf 'pr=234\nheadSha=%s\nbaseSha=%s\nmergeSha=%s\nciRunId=%s\n' "$QA_HEAD" "$QA_BASE" "$QA_MERGE" "$QA_RUN" > expected-info.txt
          diff -u expected-info.txt BUILD_INFO.txt
          rm expected-info.txt
          expected="$(sha256sum Bousygram-Cast-Lab-debug.apk)"
          [[ "$(cat SHA256SUMS.txt)" == "$expected" ]]
          sha256sum --check SHA256SUMS.txt
          mv Bousygram-Cast-Lab-debug.apk Bousygram-Cast-Lab-debug-Nov.26.2026-universal.apk
          sha256sum Bousygram-Cast-Lab-debug-Nov.26.2026-universal.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish immutable QA prerelease from verified bytes
        shell: bash
        run: |
          set -euo pipefail
          cd qa
          if gh release view "$QA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing QA release must not be overwritten."
            exit 1
          fi
          cat > RELEASE_NOTES.md <<EOF
          # Bousygram Cast Lab Debug — Nov 26, 2026

          Physical phone-to-TV QA only; not a stable release.
          Exact tested merge: $QA_MERGE
          PR head: $QA_HEAD
          Qualification: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QA_RUN

          This is the byte-identical universal ARM32/ARM64 debug APK from the
          successful four-workflow qualification, renamed for dated distribution.
          TMDB credentials are intentionally absent. Physical playback and real
          TDLib source-cache integration remain unqualified. Different debug
          signing keys may prevent updating an installed app.
          EOF
          gh release create "$QA_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$QA_MERGE" --prerelease --latest=false \
            --title "Bousygram Cast Lab Debug — Nov 26, 2026" \
            --notes-file RELEASE_NOTES.md \
            Bousygram-Cast-Lab-debug-Nov.26.2026-universal.apk SHA256SUMS.txt BUILD_INFO.txt README.txt
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$QA_TAG" >> "$GITHUB_STEP_SUMMARY"

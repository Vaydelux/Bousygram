name: Archive and prune non-main branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: archive-prune-main
  cancel-in-progress: false

jobs:
  archive-and-prune:
    # Runs only after an intentionally marked main integration commit.
    if: >-
      github.repository == 'Vaydelux/Bousygram' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[archive-prune-branches]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted mainline policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Archive only fully merged branches without active PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARCHIVE_RUN: ${{ github.run_id }}
        run: bash tools/ci/archive_prune_branches.sh

name: Publish qualified main debug once
# Release request: qualify the Extras theater overhaul and publish all three debug ABIs.
# Deliberate release request: editing this file starts all four companion
# qualifications for the same main SHA. Manual dispatch is also supported.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-integrated-debug-on-merge.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: bousygram-main-debug-request
  cancel-in-progress: true
jobs:
  request:
    if: github.repository == 'Vaydelux/Bousygram' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Wait for exact-main qualification and request debug publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          assert_current() {
            [[ "$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')" == "$GITHUB_SHA" ]] || {
              echo "::error::main moved; refusing to publish a stale revision."
              exit 1
            }
          }
          workflows=(android-enterprise.yml android-emulator-smoke.yml android-explorer-ui-smoke.yml cast-native-qualification.yml)
          latest_run() {
            gh api "repos/$repo/actions/workflows/$1/runs?branch=main&head_sha=$GITHUB_SHA&per_page=100" |
              jq -ce --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.run_number, .run_attempt) | last // {}'
          }
          assert_current
          # On manual requests only, launch missing qualifications. On a push
          # the companion path triggers already schedule these same checks.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            for workflow in "${workflows[@]}"; do
              run="$(latest_run "$workflow")"
              if [[ "$run" == '{}' ]]; then
                assert_current
                gh api --method POST "repos/$repo/actions/workflows/$workflow/dispatches" --raw-field ref=main
              fi
            done
          fi
          for ((poll=0; poll<180; poll++)); do
            assert_current
            ready=true
            for workflow in "${workflows[@]}"; do
              run="$(latest_run "$workflow")"
              status="$(jq -r '.conclusion // .status // "missing"' <<<"$run")"
              case "$status" in
                success)
                  id="$(jq -er '.id' <<<"$run")"
                  attempt="$(jq -er '.run_attempt' <<<"$run")"
                  jobs="$(gh api "repos/$repo/actions/runs/$id/attempts/$attempt/jobs?per_page=100")"
                  if [[ "$workflow" == android-enterprise.yml ]]; then
                    jq -e '.jobs | any(.[]; .name == "Build and verify" and .conclusion == "success" and any(.steps[]?; .name == "Run required Gradle verification" and .conclusion == "success"))' <<<"$jobs" >/dev/null
                  else
                    count=1
                    if [[ "$workflow" == cast-native-qualification.yml ]]; then count=2; fi
                    jq -e --arg proof "Prove tested merge $GITHUB_SHA" --argjson count "$count" '.total_count == $count and (.jobs | length == $count and all(.[]; .conclusion == "success" and any(.steps[]?; .name == $proof and .conclusion == "success")))' <<<"$jobs" >/dev/null
                  fi
                  ;;
                missing|queued|in_progress|requested|waiting|pending) ready=false ;;
                *) echo "::error::Qualification blocked: $workflow ($status). Run $run"; exit 1 ;;
              esac
            done
            if [[ "$ready" == true ]]; then
              assert_current
              release="$(latest_run dated-debug-apk.yml)"
              state="$(jq -r '.conclusion // .status // "missing"' <<<"$release")"
              case "$state" in
                success|queued|in_progress|requested|waiting|pending)
                  echo "Publication already requested for $GITHUB_SHA ($state)." >> "$GITHUB_STEP_SUMMARY"
                  exit 0 ;;
                missing|failure|cancelled|timed_out|action_required|startup_failure|stale|skipped|neutral)
                  gh api --method POST "repos/$repo/actions/workflows/dated-debug-apk.yml/dispatches" --raw-field ref=main
                  echo "Requested three dated debug APKs for qualified main $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
                  exit 0 ;;
                *) echo "::error::Unexpected publication state: $state"; exit 1 ;;
              esac
            fi
            sleep 30
          done
          echo "::error::Companion qualification did not finish within the bounded release request."
          exit 1

name: Dated Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android API 37 platform
        run: |
          set -euo pipefail
          android sdk install "platforms;android-37" "build-tools;36.0.0"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build dated debug APK
        run: bash ./gradlew :app:exportDatedDebugApk --no-daemon
      - name: Verify APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/dated-debug -maxdepth 1 -name 'Bousygram-debug-*.apk' -type f -print -quit)"
          test -n "$apk" && test -s "$apk"
          sha256sum "$apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Bousygram-dated-debug
          path: app/build/outputs/dated-debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish debug pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/dated-debug -maxdepth 1 -name 'Bousygram-debug-*.apk' -type f -print -quit)"
          test -n "$apk" && test -s "$apk"
          tag="debug-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Bousygram Debug — $(date -u '+%b %d, %Y')" \
            --notes "Debug APK for device testing. Built from commit ${GITHUB_SHA}. Not a production-signed release." \
            --prerelease

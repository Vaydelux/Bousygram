name: Dated Debug APK
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bousygram-dated-debug
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    name: Qualify and publish three dated debug APKs
    if: github.repository == 'Vaydelux/Bousygram' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_SHA: ${{ github.sha }}
      CI_VERIFICATION_RUN_ID: ${{ github.run_id }}
      ANDROID_API: '37'
      BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - name: Refuse stale main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current" == "$RELEASE_SHA" ]] || { echo "::error::main moved; refusing stale release."; exit 1; }

      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install verified Android API 37 SDK
        shell: bash
        run: bash tools/ci/setup_android_sdk.sh

      - name: Configure trusted Extras metadata credential
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$TMDB_API_KEY" =~ ^[[:xdigit:]]{32}$ ]] || { echo "::error::Configured 32-character TMDB v3 API key required."; exit 1; }
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > .env
          chmod 600 .env

      - name: Verify approved brand and unchanged Telegram metadata contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/verify_brand_identity.sh
          bash tools/ci/verify_telegram_local_only.sh

      - name: Run release-blocking JVM, lint and native compatibility gates
        shell: bash
        run: |
          set -euo pipefail
          # Keep all release gates. AGP lint model serialization can fail when
          # a dependency resolution error is persisted to the Gradle config cache.
          # A bounded retry is allowed only for the known transient Maven lookup.
          gradle_tasks=(
            :app:verifyReleaseVersionPolicy
            :app:verifyTdlibAbiCoverage
            :app:verifyTvHardeningContract
            :app:verifyPrivateMediaCastReleaseGate
            :app:verifySensitiveLogRedaction
            :app:verifyTdlibBindingCompatibility
            :app:compileDebugKotlin
            :mediaforge-core:testDebugUnitTest
            :mediaforge-player-adapters:testDebugUnitTest
            :app:lintDebug
            :app:testDebugUnitTest
            :app:assembleDebugAndroidTest
          )
          first_log="$(mktemp)"
          trap 'rm -f "$first_log"' EXIT
          if ! ./gradlew --no-daemon --no-configuration-cache --console=plain "${gradle_tasks[@]}" 2>&1 | tee "$first_log"; then
            if ! grep -Fq 'Could not find org.json:json:20231013.' "$first_log"; then
              echo "::error::Gradle verification failed for a reason other than the known transient dependency lookup."
              exit 1
            fi
            echo "::warning::Maven resolution for org.json failed; refreshing dependencies once before failing closed."
            sleep 8
            ./gradlew --no-daemon --no-configuration-cache --refresh-dependencies --console=plain "${gradle_tasks[@]}"
          fi
          python3 tools/ci/test_favorites_storage.py

      - name: Build and verify all three native ABI variants
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/build_debug_preview.sh ci-artifacts/debug-preview
          bash tools/ci/verify_debug_preview_publication.sh \
            ci-artifacts/debug-preview "$RELEASE_SHA" "$CI_VERIFICATION_RUN_ID"
          ( cd ci-artifacts/debug-preview && sha256sum --check SHA256SUMS.txt )

      - name: Prepare dated, byte-identical verified APKs
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u '+%b,%d,%Y')"
          version="$(sed -n 's/^version=//p' ci-artifacts/debug-preview/BUILD_INFO.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir -p ci-artifacts/dated-debug
          for abi in arm64-v8a armeabi-v7a universal; do
            source="ci-artifacts/debug-preview/Bousygram-debug-v${version}-build.${CI_VERIFICATION_RUN_ID}-${abi}.apk"
            destination="ci-artifacts/dated-debug/Bousygram-debug-${stamp}-${abi}.apk"
            [[ -s "$source" ]] || exit 1
            cp -- "$source" "$destination"
            [[ "$(sha256sum "$source" | cut -d' ' -f1)" == "$(sha256sum "$destination" | cut -d' ' -f1)" ]] || exit 1
          done
          cp -- ci-artifacts/debug-preview/BUILD_INFO.txt ci-artifacts/dated-debug/BUILD_INFO.txt
          ( cd ci-artifacts/dated-debug && sha256sum Bousygram-debug-*.apk > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt )
          [[ "$(find ci-artifacts/dated-debug -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 3 ]]
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - name: Publish immutable dated debug pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATE_STAMP: ${{ steps.stage.outputs.stamp }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || exit 1
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current" == "$RELEASE_SHA" ]] || { echo "::error::main moved before publication."; exit 1; }
          tag="debug-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Existing release must not be overwritten."
            exit 1
          fi
          cat > ci-artifacts/dated-debug/RELEASE_NOTES.md <<EOF
          # Bousygram Debug — $DATE_STAMP

          Source: \`$RELEASE_SHA\`
          Verification: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Debug-signed ARM32, ARM64 and universal APKs. Qualified in this job
          with Kotlin/JVM tests, lint, TDLib checks, package identity,
          signing verification, native ABI inventory, and SHA-256 checksums.

          Not production signed. Physical TV layout, D-pad and playback
          qualification is required before calling this a stable release.
          EOF
          (
            cd ci-artifacts/dated-debug
            sha256sum --check SHA256SUMS.txt
            gh release create "$tag" \
              --target "$RELEASE_SHA" --prerelease --latest=false \
              --title "Bousygram Debug — $DATE_STAMP" \
              --notes-file RELEASE_NOTES.md \
              Bousygram-debug-*.apk SHA256SUMS.txt BUILD_INFO.txt
          )
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

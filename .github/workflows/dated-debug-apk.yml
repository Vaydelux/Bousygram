name: Dated Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build dated debug APK
        run: bash ./gradlew :app:exportDatedDebugApk --no-daemon
      - name: Verify APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/dated-debug -maxdepth 1 -name 'Bousygram-debug-*.apk' -type f -print -quit)"
          test -n "$apk" && test -s "$apk"
          sha256sum "$apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Bousygram-dated-debug
          path: app/build/outputs/dated-debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

name: Release Bousygram APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected version tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: bousygram-release-request-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate tag and request controlled APK release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version tag and resolve exact source commit
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Run this workflow from main only.' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Use an existing protected semantic version tag, for example v1.0.0.' >&2
            exit 1
          }
          git fetch --force --tags origin
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Tag $RELEASE_TAG does not exist. Create and protect the tag before requesting a release." >&2
            exit 1
          }
          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          [[ "$release_sha" =~ ^[0-9a-fA-F]{40}$ && "$(git cat-file -t "$release_sha")" == 'commit' ]] || {
            echo 'The version tag does not resolve to a Git commit.' >&2
            exit 1
          }
          git fetch --force origin main
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo 'The version tag must point to a commit on the protected main branch.' >&2
            exit 1
          }
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Verify successful Android Enterprise CI for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-enterprise.yml/runs?head_sha=$RELEASE_SHA&event=push&per_page=100")"
          # shellcheck disable=SC2016
          ci_run_id="$(jq -r --arg sha "$RELEASE_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and .event == "push" and
              .head_branch == "main" and .status == "completed" and
              .conclusion == "success" and .path == ".github/workflows/android-enterprise.yml"
            )] | sort_by(.run_number) | last | .id // empty
          ' <<< "$runs")"
          [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo 'No successful exact-commit Android Enterprise CI run exists for this tag.' >&2
            exit 1
          }
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/jobs?per_page=100")"
          # shellcheck disable=SC2016
          jq -e '[.jobs[] | select(.name == "Build and verify" and .status == "completed" and .conclusion == "success")] | length == 1' <<< "$jobs" >/dev/null || {
            echo 'The exact-commit Android Enterprise CI run lacks a successful Build and verify job.' >&2
            exit 1
          }
          echo "Verified Android Enterprise run $ci_run_id for commit $RELEASE_SHA"

      - name: Refuse to overwrite an existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub Release for $RELEASE_TAG already exists. Refusing to overwrite it." >&2
            exit 1
          fi

      - name: Start the protected signed-APK build and release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run android-release.yml --ref main \
            --raw-field "tag=$RELEASE_TAG" \
            --raw-field "source_sha=$RELEASE_SHA"
          {
            echo '### Controlled APK release requested'
            echo "Tag: $RELEASE_TAG"
            echo "Source commit: $RELEASE_SHA"
            echo "Track the downstream workflow: https://github.com/$GITHUB_REPOSITORY/actions/workflows/android-release.yml"
            echo 'This request is not a completed release. Signing, artifact validation, device qualification, and protected publishing approval still apply.'
          } >> "$GITHUB_STEP_SUMMARY"

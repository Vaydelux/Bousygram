name: Release Bousygram APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version: auto (recommended) or explicit vMAJOR.MINOR.PATCH"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

# All manual release requests serialize their version selection.
concurrency:
  group: bousygram-release-tag-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Create version tag and request protected APK release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact requested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and select safe version
        id: source
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo '::error::Run this action from main only.' >&2
            exit 1
          }
          [[ "$RELEASE_SHA" =~ ^[a-fA-F0-9]{40}$ && "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo '::error::Workflow source commit mismatch.' >&2
            exit 1
          }
          git fetch origin main --tags --force
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo '::error::Requested commit is no longer in main history.' >&2
            exit 1
          }
          requested="${REQUESTED_TAG:-auto}"
          if [[ "$requested" == auto ]]; then
            candidate="$(bash tools/ci/next_release_tag.sh next)"
            latest="$(bash tools/ci/next_release_tag.sh latest)"
            if [[ -n "$latest" ]]; then
              latest_sha="$(git rev-parse "refs/tags/$latest^{}")"
              # Retry an unqualified version on the same source instead of producing tag clutter.
              if [[ "$latest_sha" == "$RELEASE_SHA" ]] && ! gh release view "$latest" >/dev/null 2>&1; then
                candidate="$latest"
              fi
            fi
          else
            candidate="$requested"
          fi
          [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo '::error::Use auto or a semantic version like v1.0.0.' >&2
            exit 1
          }
          if git show-ref --verify --quiet "refs/tags/$candidate"; then
            actual="$(git rev-parse "refs/tags/$candidate^{}")"
            [[ "$actual" == "$RELEASE_SHA" ]] || {
              echo "::error::Tag $candidate already belongs to a different commit; not moving it." >&2
              exit 1
            }
          fi
          if gh release view "$candidate" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for $candidate already exists; refusing overwrite." >&2
            exit 1
          fi
          echo "tag=$candidate" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Selected version $candidate for commit $RELEASE_SHA"

      - name: Verify successful exact-commit mainline CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-enterprise.yml/runs?head_sha=$RELEASE_SHA&event=push&per_page=100")"
          # shellcheck disable=SC2016
          ci_run_id="$(jq -r --arg sha "$RELEASE_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and .event == "push" and
              .head_branch == "main" and .status == "completed" and
              .conclusion == "success" and .path == ".github/workflows/android-enterprise.yml"
            )] | sort_by(.run_number) | last | .id // empty
          ' <<< "$runs")"
          [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::No successful exact-commit mainline Android Enterprise CI exists.' >&2
            exit 1
          }
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/jobs?per_page=100")"
          # shellcheck disable=SC2016
          jq -e '[.jobs[] | select(.name == "Build and verify" and .status == "completed" and .conclusion == "success")] | length == 1' <<< "$jobs" >/dev/null || {
            echo '::error::The exact CI run does not contain a successful Build and verify job.' >&2
            exit 1
          }
          echo "Verified CI run $ci_run_id for $RELEASE_SHA"

      - name: Create immutable annotated version tag if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" == "$RELEASE_SHA" ]] || exit 1
            echo "Reusing tag $RELEASE_TAG"
          else
            tag_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              --raw-field "tag=$RELEASE_TAG" \
              --raw-field "message=Bousygram $RELEASE_TAG verified commit $RELEASE_SHA" \
              --raw-field "object=$RELEASE_SHA" \
              --raw-field "type=commit" --jq .sha)"
            [[ "$tag_sha" =~ ^[a-f0-9]{40}$ ]] || {
              echo '::error::GitHub failed to create annotated tag object.' >&2
              exit 1
            }
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field "ref=refs/tags/$RELEASE_TAG" \
              --raw-field "sha=$tag_sha" >/dev/null || {
              echo '::error::Tag creation failed; check write permissions and tag protection.' >&2
              exit 1
            }
            echo "Created annotated version tag $RELEASE_TAG"
          fi
          {
            echo '### Version selected for release'
            echo "Tag: $RELEASE_TAG"
            echo "Exact source commit: $RELEASE_SHA"
            echo 'No release is published until production signing and device approval complete.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start protected signed-APK release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run android-release.yml --ref main \
            --raw-field "tag=$RELEASE_TAG" \
            --raw-field "source_sha=$RELEASE_SHA"
          {
            echo '### Protected release pipeline requested'
            echo "Version: $RELEASE_TAG"
            echo "Source commit: $RELEASE_SHA"
            echo "Follow: https://github.com/$GITHUB_REPOSITORY/actions/workflows/android-release.yml"
            echo 'Production signing, APK verification, hardware qualification, and release approvals still apply.'
          } >> "$GITHUB_STEP_SUMMARY"

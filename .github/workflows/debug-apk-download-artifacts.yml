name: Build and Publish Bousygram QA Debug APKs

# Source-pinned, debug-signed QA APKs. Runs on manual dispatch or when this
# workflow is changed on main. Publishes an immutable prerelease (not production).
# Does not bypass protected production release gates or overwrite existing tags.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-apk-download-artifacts.yml'

permissions:
  contents: write

concurrency:
  group: bousygram-downloadable-debug
  cancel-in-progress: false

jobs:
  build-debug-apks:
    name: Verify and package test APKs (ARM32, ARM64, universal)
    if: github.repository == 'Vaydelux/Bousygram' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_API: '37'
      BUILD_TOOLS_VERSION: '35.0.0'
      RELEASE_SHA: ${{ github.sha }}
      CI_VERIFICATION_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Assert this source is the current main HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current" == "$RELEASE_SHA" ]] || {
            echo "::error::main moved. Refuse to upload stale-source APKs."
            exit 1
          }

      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android build requirements
        shell: bash
        run: bash tools/ci/setup_android_sdk.sh

      - name: Configure trusted debug TMDB credentials
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$TMDB_API_KEY" =~ ^[[:xdigit:]]{32}$ ]] || {
            echo "::error::A valid TMDB_API_KEY repository secret is required for trusted debug APKs."
            exit 1
          }
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > .env
          chmod 600 .env

      - name: Verify Kotlin, unit tests and lint before packaging
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:verifyReleaseVersionPolicy \
            :app:verifyTdlibAbiCoverage \
            :app:verifyTdlibBindingCompatibility \
            :app:verifyTvHardeningContract \
            :app:verifySensitiveLogRedaction \
            :mediaforge-core:testDebugUnitTest \
            :mediaforge-player-adapters:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug

      - name: Build and verify real ABI-specific APKs
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/verify_brand_identity.sh
          bash tools/ci/build_debug_preview.sh ci-artifacts/debug-preview
          ( cd ci-artifacts/debug-preview && sha256sum --check SHA256SUMS.txt )
          grep -Fxq "sourceSha=$RELEASE_SHA" ci-artifacts/debug-preview/BUILD_INFO.txt
          [[ "$(find ci-artifacts/debug-preview -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 3 ]]


      - name: Publish immutable QA debug prerelease on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo "::error::Checked-out source SHA changed"
            exit 1
          }
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$head_sha" == "$RELEASE_SHA" ]] || {
            echo "::error::main moved during QA packaging; refusing stale release"
            exit 1
          }
          version="$(sed -n 's/^version=//p' ci-artifacts/debug-preview/BUILD_INFO.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          tag="v${version}-debug.qa.${RELEASE_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Immutable QA debug release already exists: $tag"
            exit 1
          fi
          (
            cd ci-artifacts/debug-preview
            sha256sum --check SHA256SUMS.txt
          )
          cat > ci-artifacts/debug-preview/RELEASE_NOTES.md <<EOF
          # Bousygram Debug QA — $tag

          Exact source: \`$RELEASE_SHA\`
          Verification: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Debug APKs: ARM32 (armeabi-v7a), ARM64 (arm64-v8a), and universal.
          Verified in this job: Kotlin compilation, unit tests, lint, TDLib native
          bindings, APK signing, native ABI matrix and SHA-256 hashes.

          This is a **debug-signed QA prerelease**, not a production release.
          Physical Android TV verification is still required. Emulator testing
          is tracked separately in the normal smoke workflows.
          EOF
          gh release create "$tag" \
            --target "$RELEASE_SHA" \
            --prerelease --latest=false \
            --title "Bousygram $version QA Debug ($RELEASE_SHA)" \
            --notes-file ci-artifacts/debug-preview/RELEASE_NOTES.md \
            ci-artifacts/debug-preview/Bousygram-debug-*.apk \
            ci-artifacts/debug-preview/SHA256SUMS.txt \
            ci-artifacts/debug-preview/BUILD_INFO.txt
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Report exact-source QA result
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo 'Debug-signed QA APKs published to immutable GitHub Releases.'
            echo "Source SHA: $RELEASE_SHA"
            echo 'Physical TV and emulator qualification remain separate.'
          } >> "$GITHUB_STEP_SUMMARY"

name: Publish Bousygram web preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-preview-pages.yml'

concurrency:
  group: bousygram-web-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check browser scripts
        run: |
          node --check web/player.js
          node --check web/theme.mjs
          node --check web/sw.js
          node --test web/tests/*.test.mjs
          python3 -m json.tool web/manifest.webmanifest > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          root = Path("web")
          for asset in ["index.html", "icon.png", "styles.css", "player.js",
                        "theme.mjs", "qr.svg", "manifest.webmanifest", "sw.js"]:
              assert (root / asset).is_file(), f"Missing offline shell asset: {asset}"
          html = (root / "index.html").read_text()
          assert html.count('<option value=') == 16, "Theme selector must match Android presets"
          assert 'type="file"' in html and 'type="range"' in html
          PY
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Package the web preview
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0bb # v4.0.0
        with:
          path: web
      - name: Publish the web preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

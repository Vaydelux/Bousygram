name: Publish Bousygram web preview

on:
  workflow_dispatch:

concurrency:
  group: bousygram-web-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check browser scripts
        run: |
          node --check web/player.js
          node --check web/sw.js
          python3 -m json.tool web/manifest.webmanifest > /dev/null
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Package the web preview
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: web
      - name: Publish the web preview
        id: deployment
        uses: actions/deploy-pages@d6db90164e3825a3b43aadd9b6c14c95f21b21d9 # v4.0.5

name: Bousygram Debug APK Prereleases

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bousygram-manual-debug-prerelease
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: >-
      github.repository == 'Vaydelux/Bousygram' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      CI_VERIFICATION_RUN_ID: ${{ github.run_id }}
      ANDROID_API: '37'
      BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - name: Verify manual request matches latest main
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$RELEASE_SHA" ]] || {
            echo "::error::Main moved. Refusing to release a stale commit."
            exit 1
          }

      - name: Check out exact merged main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify mascot, launcher and favicon use canonical brand
        shell: bash
        run: bash tools/ci/verify_brand_identity.sh

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android build requirements
        shell: bash
        run: bash tools/ci/setup_android_sdk.sh

      - name: Configure trusted TMDB v3 key
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$TMDB_API_KEY" =~ ^[[:xdigit:]]{32}$ ]] || {
            echo "::error::Trusted debug build needs configured TMDB_API_KEY."
            exit 1
          }
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > .env
          chmod 600 .env

      - name: Verify lint, unit tests, native bindings and debug instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:verifyReleaseVersionPolicy \
            :app:verifyTdlibAbiCoverage \
            :app:verifyTvHardeningContract \
            :app:verifyPrivateMediaCastReleaseGate \
            :app:verifySensitiveLogRedaction \
            :app:verifyTdlibBindingCompatibility \
            :app:compileDebugKotlin \
            :mediaforge-core:testDebugUnitTest \
            :mediaforge-player-adapters:testDebugUnitTest \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest
          test -s app/schemas/com.vaydelux.bousygram.data.database.AppDatabase/2.json
          bash tools/ci/verify_debug_artifacts.sh

      - name: Generate checksum-verified decoder fixtures
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          bash tools/ci/generate_playback_fixtures.sh ci-artifacts/decoder-fixtures
          ( cd ci-artifacts/decoder-fixtures && sha256sum --check SHA256SUMS.txt )

      - name: Prepare emulator disk
        shell: bash
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi

      - name: Run Android UI and playback instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_4
          disk-size: 3072M
          emulator-options: -partition-size 3072 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/ci/run_emulator_smoke.sh

      - name: Build and verify ARM32 ARM64 and universal debug APKs
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/build_debug_preview.sh ci-artifacts/debug-preview
          ( cd ci-artifacts/debug-preview && sha256sum --check SHA256SUMS.txt )
          [[ "$(find ci-artifacts/debug-preview -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 3 ]]
          grep -Fxq "sourceSha=$RELEASE_SHA" ci-artifacts/debug-preview/BUILD_INFO.txt

      - name: Publish immutable manually-qualified GitHub debug prerelease
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$RELEASE_SHA" ]]
          version="$(sed -n 's/^version=//p' ci-artifacts/debug-preview/BUILD_INFO.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}-debug.manual.${RELEASE_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing to overwrite."
            exit 1
          fi
          cat > ci-artifacts/debug-preview/RELEASE_NOTES.md <<EOF
          # Bousygram $tag — debug APKs

          Source commit: \`$RELEASE_SHA\` (merged main)
          Verified by this one-time CI job: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Checks: Android compile, unit/lint, TDLib ABI and binding, emulator instrumentation, APK signatures, package/version/ABI matrix and SHA-256.
          Exception: the standard CI publisher was blocked by exhausted GitHub Actions artifact storage. This pipeline builds and publishes directly to GitHub Releases without uploading Actions artifacts.

          These are **debug-signed test APKs, not production releases**. Physical ARM32/ARM64 TV qualification remains outstanding. Debug keystore differences may require uninstalling the previous test APK before installation.
          EOF
          gh release create "$tag" \
            --target "$RELEASE_SHA" \
            --prerelease --latest=false \
            --title "Bousygram $version Debug — manual verified build" \
            --notes-file ci-artifacts/debug-preview/RELEASE_NOTES.md \
            ci-artifacts/debug-preview/Bousygram-debug-*.apk \
            ci-artifacts/debug-preview/SHA256SUMS.txt \
            ci-artifacts/debug-preview/BUILD_INFO.txt
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

name: Finalize unified phone TV UI debug release once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-uniform-ui-debug-once.yml"

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  cleanup-and-debug:
    if: github.repository == 'Vaydelux/Bousygram' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify approved merge, prune feature branch and dispatch qualified APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/173" --jq '.merged')" == true ]] || {
            echo "::error::PR #173 is not merged; refusing cleanup"
            exit 1
          }
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::Main moved during finalization; refusing stale source"
            exit 1
          }
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            case "$branch" in
              main) ;;
              fix/unified-premium-phone-tv-20261111)
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
                echo "Deleted merged branch: $branch"
                ;;
              *) echo "::error::Unexpected branch '$branch'; refusing cleanup"; exit 1 ;;
            esac
          done
          [[ "$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')" == main ]] || exit 1
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/android-debug-prerelease.yml/dispatches" --raw-field ref=main
          echo "Requested qualified ARM32 ARM64 universal APKs from $GITHUB_SHA with main as sole branch" >> "$GITHUB_STEP_SUMMARY"

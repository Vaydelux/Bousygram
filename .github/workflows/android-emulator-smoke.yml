name: Android Emulator Cast Smoke

on:
  # Every mainline debug prerelease must have an exact-commit emulator check.
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'app/src/main/java/com/vaydelux/bousygram/core/cast/**'
      - 'app/src/main/java/com/vaydelux/bousygram/core/media/**'
      - 'app/src/main/java/com/vaydelux/bousygram/core/cache/**'
      - 'app/src/main/java/com/vaydelux/bousygram/core/tdlib/cache/**'
      - 'app/src/test/java/com/vaydelux/bousygram/core/cache/**'
      - 'app/src/main/java/com/vaydelux/bousygram/presentation/media/**'
      - 'app/src/main/java/com/vaydelux/bousygram/presentation/theme/**'
      - 'app/src/main/java/com/vaydelux/bousygram/presentation/layout/**'
      - 'app/src/main/java/com/vaydelux/bousygram/presentation/components/**'
      - 'app/src/main/java/com/vaydelux/bousygram/presentation/settings/**'
      # Extras hosts the MediaForge SDK and has emulator D-pad/WebView tests.
      - 'app/src/main/java/com/vaydelux/bousygram/presentation/extras/**'
      - 'mediaforge-core/**'
      - 'mediaforge-webbridge/**'
      - 'mediaforge-player-adapters/**'
      - 'app/src/main/java/com/vaydelux/bousygram/app/MainActivity.kt'
      - 'app/src/androidTest/**'
      - 'tools/ci/generate_playback_fixtures.sh'
      - 'tools/ci/run_emulator_smoke.sh'
      - 'app/src/main/res/values/themes.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cast-emulator:
    name: Run Cast and media UI regressions on Android emulator
    # Keep decoder fixture generation reproducible: ubuntu-latest advanced to
    # a runner whose configured APT repositories did not offer ffmpeg, failing
    # before emulator instrumentation on otherwise successful APK builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android build dependencies
        shell: bash
        run: bash tools/ci/setup_android_sdk.sh

      - name: Enable KVM acceleration when available
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          else
            echo '::warning::KVM unavailable; the emulator may run slowly.'
          fi

      - name: Build exact-commit debug APK and instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
          bash tools/ci/verify_debug_artifacts.sh

      - name: Generate real decoder fixtures and validate their checksums
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          bash tools/ci/generate_playback_fixtures.sh ci-artifacts/decoder-fixtures
          ( cd ci-artifacts/decoder-fixtures && sha256sum --check SHA256SUMS.txt )

      - name: Run media Cast, real-launch, D-pad, and adaptive player chrome instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          # API 35 Automated Test Device removes Launcher3QuickStep and disables
          # nonessential background services. Our prior default image intermittently
          # ANRed in AOSP Launcher, hiding the app during UI instrumentation.
          # No screenshot pixel assertions: tests exercise Compose/UIAutomator semantics.
          target: aosp_atd
          arch: x86_64
          profile: pixel_4
          # Default pixel_4 userdata requested 7.37 GB on Ubuntu 24.04 while
          # only 6.38 GB remained after the exact-source Gradle + FFmpeg build.
          # 3 GiB is sufficient for the synthetic decoder fixtures/UI tests.
          disk-size: 3072M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/ci/run_emulator_smoke.sh

      - name: Archive emulator smoke results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-cast-smoke-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            emulator-smoke-results.txt
            ci-artifacts/decoder-fixtures/SHA256SUMS.txt
            emulator-smoke-crash-summary.txt
            emulator-smoke-window-state.txt
            emulator-smoke-screen.png
            emulator-adb-devices.txt
            emulator-cold-launch.txt

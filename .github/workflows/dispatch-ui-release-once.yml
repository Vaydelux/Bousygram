name: Dispatch qualified UI redesign debug APK release once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-ui-release-once.yml"

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  cleanup-and-request-debug:
    if: github.repository == 'Vaydelux/Bousygram' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify PR 174, prune merged branch and dispatch qualified debug release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          merged="$(gh api "repos/$repo/pulls/174" --jq '.merged')"
          [[ "$merged" == true ]] || { echo "::error::PR 174 not merged"; exit 1; }
          pr_sha="$(gh api "repos/$repo/pulls/174" --jq '.merge_commit_sha')"
          [[ "$pr_sha" == "9c546a74223f36d9ad6ef0f7510f851707c44158" ]] || {
            echo "::error::Unexpected PR merge SHA: $pr_sha"; exit 1;
          }
          main_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::main moved before dispatch"; exit 1;
          }
          mapfile -t branches < <(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')
          for name in "${branches[@]}"; do
            case "$name" in
              main) ;;
              fix/content-first-responsive-explorer-20261111)
                gh api --method DELETE "repos/$repo/git/refs/heads/$name"
                ;;
              *) echo "::error::Refusing unexpected branch $name"; exit 1 ;;
            esac
          done
          remaining="$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')"
          [[ "$remaining" == "main" ]] || { echo "::error::Expected only main, found $remaining"; exit 1; }
          gh api --method POST "repos/$repo/actions/workflows/android-debug-prerelease.yml/dispatches" --raw-field ref=main
          echo "Dispatched qualified ARM32, ARM64 and universal debug prerelease on $main_sha" >> "$GITHUB_STEP_SUMMARY"

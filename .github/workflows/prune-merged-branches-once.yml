name: One-time prune reviewed merged branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-merged-branches-once.yml"

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'Vaydelux/Bousygram' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm PR merged, then delete only reviewed topic branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/${GH_REPO}/pulls/171" --jq '.merged')" == "true" ]] || {
            echo "::error::PR #171 must be merged before branch cleanup"
            exit 1
          }
          mapfile -t branches < <(gh api --paginate "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            case "$branch" in
              main) continue ;;
              ci/lean-actions-quota-20261111|design/compose-dialog-auth-series-pass-20261111|fix/library-latest-chat-snapshot-20261111|fix/tv-playback-accessibility-arm32-20261111|perf/focus-prefetch-dpad-20261111|perf/telegram-cache-seek-overflow-20261110) ;;
              *) echo "::error::Unreviewed branch '$branch': refusing destructive cleanup"; exit 1 ;;
            esac
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
            echo "Removed reviewed branch: $branch"
          done
          remaining="$(gh api --paginate "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name')"
          if [[ "$remaining" != "main" ]]; then
            echo "::error::Repository still contains unexpected branch refs"
            printf '%s\n' "$remaining"
            exit 1
          fi
          echo "Verified only main remains"

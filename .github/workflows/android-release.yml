name: Android Controlled Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected version tag to release (for example v1.0.0)
        required: true
        type: string
      source_sha:
        description: Exact commit SHA the tag must resolve to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  ANDROID_API: '37'
  BUILD_TOOLS_VERSION: 35.0.0

jobs:
  validate-release-request:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.verify-ci.outputs.run_id }}
    steps:
      - name: Check out requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate tag, commit, and Gradle metadata
        id: verify-ci
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be a full commit SHA" >&2; exit 1; }
          git fetch --tags --force origin
          resolved="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          [[ "$resolved" == "$RELEASE_SHA" ]] || { echo "Tag $RELEASE_TAG resolves to $resolved, not $RELEASE_SHA" >&2; exit 1; }
          git fetch origin main --force
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'Release commit is not in protected origin/main lineage' >&2; exit 1; }
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-enterprise.yml/runs?head_sha=${RELEASE_SHA}&event=push&per_page=100")"
          # shellcheck disable=SC2016
          run_id="$(jq -r --arg sha "$RELEASE_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and .event == "push" and .status == "completed" and
              .conclusion == "success" and .path == ".github/workflows/android-enterprise.yml" and
              .head_branch == "main"
            )] | sort_by(.run_number) | last | .id // empty
          ' <<<"$runs")"
          [[ -n "$run_id" ]] || { echo 'No successful Android Enterprise workflow run exists for this exact mainline commit.' >&2; exit 1; }
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          jq -e '[.jobs[] | select(.name == "Build and verify" and .status == "completed" and .conclusion == "success")] | length == 1' <<<"$jobs" >/dev/null || {
            echo 'The exact-commit Android Enterprise run lacks its successful required Build and verify job.' >&2
            exit 1
          }
          grep -Fq 'gradleProperty("releaseVersionName")' app/build.gradle.kts || {
            echo "Gradle does not expose controlled release version metadata" >&2
            exit 1
          }
          mode="$(git ls-files --stage gradlew | awk '{print $1}')"
          [[ "$mode" == 100755 && -x ./gradlew ]] || { echo "gradlew is not tracked executable" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  device-qualification:
    name: Require device qualification evidence
    needs: signed-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-qualification
    steps:
      - name: Check out exact verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download signed release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: release-artifacts

      - name: Apply protected qualification using the tested manifest validator
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          QUALIFICATION_JSON: ${{ secrets.RELEASE_DEVICE_QUALIFICATION_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$QUALIFICATION_JSON" ]] || { echo "Release blocked: protected device qualification is missing" >&2; exit 1; }
          printf '%s' "$QUALIFICATION_JSON" > qualification.json
          trap 'rm -f qualification.json' EXIT
          bash tools/ci/qualify_release_manifest.sh release-artifacts qualification.json "$RELEASE_TAG" "$RELEASE_SHA"
          jq -e --arg sha "$RELEASE_SHA" '
            .commit == $sha and .deviceQualification.status == "passed" and
            (.deviceQualificationEvidence | type == "string" and startswith("https://"))
          ' release-artifacts/RELEASE_MANIFEST.json >/dev/null
          {
            echo "## Verified device qualification"
            echo "Commit: $RELEASE_SHA"
            echo "Evidence: $(jq -r .deviceQualificationEvidence release-artifacts/RELEASE_MANIFEST.json)"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '\n## Approved device qualification\nEvidence: %s\n' \
            "$(jq -r .deviceQualificationEvidence release-artifacts/RELEASE_MANIFEST.json)" \
            >> release-artifacts/RELEASE_VERIFICATION.md

      - name: Archive only the qualified signed release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: release-artifacts/
          retention-days: 30
          if-no-files-found: error

  signed-build:
    name: Build and verify signed APK matrix
    needs: validate-release-request
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production-signing
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      VERIFIED_CI_RUN_ID: ${{ needs.validate-release-request.outputs.ci_run_id }}
      RELEASE_VERSION: ${{ inputs.tag }}
      RELEASE_STORE_FILE: ${{ github.workspace }}/.ci/bousygram-release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK dependencies
        shell: bash
        run: bash tools/ci/setup_android_sdk.sh

      - name: Validate signing secrets without printing them
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" && -n "$RELEASE_CERT_SHA256" ]] || {
            echo 'Production signing is blocked: one or more protected signing secrets are missing.' >&2
            exit 1
          }
          mkdir -p "$(dirname "$RELEASE_STORE_FILE")"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          chmod 600 "$RELEASE_STORE_FILE"

      - name: Run release gates and build
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          ./gradlew --no-daemon --console=plain \
            -PreleaseVersionName="$version" \
            :app:verifyTdlibAbiCoverage \
            :app:verifyTdlibBindingCompatibility \
            :app:verifyTvHardeningContract \
            :app:verifyPrivateMediaCastReleaseGate \
            :app:verifySensitiveLogRedaction \
            :app:assembleHardenedRelease

      - name: Verify three release APKs and create manifest
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          export RELEASE_VERSION="$version"
          mapfile -t metadata_files < <(find app/build/outputs/apk/hardenedRelease -maxdepth 2 -name output-metadata.json -type f -print)
          [[ ${#metadata_files[@]} -eq 1 ]] || { echo "Expected one AGP output-metadata.json, found ${#metadata_files[@]}" >&2; exit 1; }
          metadata="${metadata_files[0]}"
          actual_version="$(jq -er '[.elements[].versionName] | unique | if length == 1 then .[0] else error("APK outputs disagree on versionName") end' "$metadata")"
          actual_version_code="$(jq -er '[.elements[].versionCode] | unique | if length == 1 then .[0] else error("APK outputs disagree on versionCode") end' "$metadata")"
          [[ "$actual_version" == "$version" ]] || { echo "Built version $actual_version does not match requested $version" >&2; exit 1; }
          build_tools="$ANDROID_BUILD_TOOLS_DIR"
          bash tools/ci/verify_release_apks.sh \
            app/build/outputs/apk/hardenedRelease \
            release-artifacts \
            "$RELEASE_CERT_SHA256" \
            "$build_tools" \
            "$actual_version" \
            "$actual_version_code"
          export RELEASE_VERSION="$actual_version"
          export RELEASE_VERSION_CODE="$actual_version_code"
          export TDLIB_COMMIT="$(grep -oE '[0-9a-fA-F]{40}' build-tools/tdlib/RESOLVED_COMMIT.txt | head -1)"
          export CI_VERIFICATION_RUN_ID="$VERIFIED_CI_RUN_ID"
          export CI_VERIFICATION_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_CI_RUN_ID}"
          bash tools/ci/create_release_manifest.sh release-artifacts
          jq -e --arg runId "$VERIFIED_CI_RUN_ID" --arg sha "$RELEASE_SHA" '
            .commit == $sha and .ciVerification.sourceCommit == $sha and
            (.ciVerification.runId | tostring) == $runId and
            .deviceQualification.status == "pending" and .deviceQualificationEvidence == null
          ' release-artifacts/RELEASE_MANIFEST.json >/dev/null
          sha256sum release-artifacts/*.apk > release-artifacts/SHA256SUMS.txt
          cp tools/tdlib/BUILD_METADATA.txt release-artifacts/TDLIB_BUILD_METADATA.txt
          cp tools/tdlib/BUILD_VERIFICATION.txt release-artifacts/TDLIB_BUILD_VERIFICATION.txt
          {
            printf '# Bousygram %s\n\n' "$RELEASE_TAG"
            printf -- "- Source commit: \`%s\`\n" "$RELEASE_SHA"
            printf -- "- TDLib commit: \`%s\`\n" "$TDLIB_COMMIT"
            printf -- '- Device qualification: protected commit-specific record\n'
            printf -- "- Signing certificate: verified against protected \`RELEASE_CERT_SHA256\`\n"
            printf -- "- APK matrix: ARM32, ARM64, universal\n"
          } > release-artifacts/RELEASE_VERIFICATION.md
          printf 'Bousygram %s hardened release\n' "$RELEASE_TAG" > release-artifacts/RELEASE_NOTES.md

      - name: Archive signed release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          retention-days: 30
          if-no-files-found: error
          path: release-artifacts/

      - name: Remove temporary keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RELEASE_STORE_FILE"

  create-draft:
    name: Create verified draft release
    needs: [validate-release-request, device-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-draft
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Download the protected, qualified signed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: release-artifacts

      - name: Refuse overwrite and create draft
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
          VERIFIED_CI_RUN_ID: ${{ needs.validate-release-request.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          sha256sum -c release-artifacts/SHA256SUMS.txt
          [[ "$VERIFIED_CI_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Missing verified Android Enterprise run identity" >&2; exit 1; }
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" --arg ciRunId "$VERIFIED_CI_RUN_ID" '
            .tag == $tag and .commit == $sha and
            .ciVerification.workflow == "android-enterprise.yml" and
            (.ciVerification.runId | tostring) == $ciRunId and
            .ciVerification.sourceCommit == $sha and
            .deviceQualification.status == "passed" and
            (.deviceQualificationEvidence | type == "string" and startswith("https://"))
          ' release-artifacts/RELEASE_MANIFEST.json >/dev/null
          jq -e --slurpfile manifest release-artifacts/RELEASE_MANIFEST.json '
            .status == "passed" and .commit == $manifest[0].commit and
            .evidenceUrl == $manifest[0].deviceQualificationEvidence and
            .apkSha256 == $manifest[0].apkSha256
          ' release-artifacts/DEVICE_QUALIFICATION.json >/dev/null
          for kind in armeabi-v7a arm64-v8a universal; do
            mapfile -t apks < <(find release-artifacts -maxdepth 1 -type f -name "*-$kind.apk" -print)
            [[ ${#apks[@]} -eq 1 ]] || { echo "Incorrect $kind artifact count" >&2; exit 1; }
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing overwrite." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "Bousygram $RELEASE_TAG" \
            --notes-file release-artifacts/RELEASE_NOTES.md \
            release-artifacts/Bousygram-*.apk \
            release-artifacts/SHA256SUMS.txt \
            release-artifacts/RELEASE_MANIFEST.json \
            release-artifacts/DEVICE_QUALIFICATION.json \
            release-artifacts/RELEASE_VERIFICATION.md \
            release-artifacts/TDLIB_BUILD_METADATA.txt \
            release-artifacts/TDLIB_BUILD_VERIFICATION.txt

  publish:
    name: Publish approved release
    needs: create-draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Publish existing draft only
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          gh release edit "$RELEASE_TAG" --draft=false --latest

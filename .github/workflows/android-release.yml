name: Android Controlled Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected version tag to release (for example v1.0.0)
        required: true
        type: string
      source_sha:
        description: Exact commit SHA the tag must resolve to
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: android-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  ANDROID_PLATFORM: android-37
  ANDROID_BUILD_TOOLS: 35.0.0

jobs:
  validate-release-request:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate tag, commit, and Gradle metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be a full commit SHA" >&2; exit 1; }
          git fetch --tags --force origin
          resolved="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          [[ "$resolved" == "$RELEASE_SHA" ]] || { echo "Tag $RELEASE_TAG resolves to $resolved, not $RELEASE_SHA" >&2; exit 1; }
          git fetch origin main --force
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'Release commit is not in protected origin/main lineage' >&2; exit 1; }
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100" --jq '.check_runs[] | select(.name == "Build and verify") | .conclusion')"
          grep -qx 'success' <<<"$checks" || { echo 'No successful Build and verify check exists for the exact release commit' >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          grep -Fq 'gradleProperty("releaseVersionName")' app/build.gradle.kts || {
            echo "Gradle does not expose controlled release version metadata" >&2
            exit 1
          }
          mode="$(git ls-files --stage gradlew | awk '{print $1}')"
          [[ "$mode" == 100755 && -x ./gradlew ]] || { echo "gradlew is not tracked executable" >&2; exit 1; }

  device-qualification:
    name: Require device qualification evidence
    needs: signed-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-qualification
    steps:
      - name: Download signed candidate for qualification identity check
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: release-artifacts

      - name: Require protected qualification record
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          QUALIFICATION_JSON: ${{ secrets.RELEASE_DEVICE_QUALIFICATION_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$QUALIFICATION_JSON" ]] || { echo 'Release blocked: protected qualification JSON is missing.' >&2; exit 1; }
          printf '%s' "$QUALIFICATION_JSON" > qualification.json
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" '
            .status == "passed" and .tag == $tag and .commit == $sha and
            .nativeTdlibRuntime == "passed" and .reviewerApproval == true and
            (.evidenceUrl | startswith("https://")) and
            (.apkSha256.arm32 | test("^[0-9a-fA-F]{64}$")) and
            (.apkSha256.arm64 | test("^[0-9a-fA-F]{64}$")) and
            (.apkSha256.universal | test("^[0-9a-fA-F]{64}$"))
          ' qualification.json >/dev/null || { echo 'Release blocked: qualification is not commit/tag/runtime/artifact specific.' >&2; exit 1; }
          sha256sum -c release-artifacts/SHA256SUMS.txt
          arm32="$(sha256sum release-artifacts/*armeabi-v7a.apk | awk '{print tolower($1)}')"
          arm64="$(sha256sum release-artifacts/*arm64-v8a.apk | awk '{print tolower($1)}')"
          universal="$(sha256sum release-artifacts/*universal.apk | awk '{print tolower($1)}')"
          jq -e --arg a "$arm32" --arg b "$arm64" --arg u "$universal" '((.apkSha256.arm32|ascii_downcase) == $a) and ((.apkSha256.arm64|ascii_downcase) == $b) and ((.apkSha256.universal|ascii_downcase) == $u)' qualification.json >/dev/null || {
            echo 'Release blocked: device evidence hashes do not match the signed candidate APKs.' >&2; exit 1;
          }
          {
            echo '## Device qualification'
            echo "Commit: $RELEASE_SHA"
            echo "Evidence: $(jq -r .evidenceUrl qualification.json)"
          } >> "$GITHUB_STEP_SUMMARY"

  signed-build:
    name: Build and verify signed APK matrix
    needs: validate-release-request
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production-signing
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.tag }}
      RELEASE_STORE_FILE: ${{ github.workspace }}/.ci/bousygram-release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK dependencies
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/tmp/bousygram-sdk-licenses.log 2>&1
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          cat /tmp/bousygram-sdk-licenses.log
          (( sdk_status == 0 )) || exit "$sdk_status"
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Validate signing secrets without printing them
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" && -n "$RELEASE_CERT_SHA256" ]] || {
            echo 'Production signing is blocked: one or more protected signing secrets are missing.' >&2
            exit 1
          }
          mkdir -p "$(dirname "$RELEASE_STORE_FILE")"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          chmod 600 "$RELEASE_STORE_FILE"

      - name: Run release gates and build
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          ./gradlew --no-daemon --console=plain \
            -PreleaseVersionName="$version" \
            :app:verifyTdlibAbiCoverage \
            :app:verifyTdlibBindingCompatibility \
            :app:verifyTvHardeningContract \
            :app:verifyPrivateMediaCastReleaseGate \
            :app:verifySensitiveLogRedaction \
            :app:assembleHardenedRelease

      - name: Verify three release APKs and create manifest
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          export RELEASE_VERSION="$version"
          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          bash tools/ci/verify_release_apks.sh \
            app/build/outputs/apk/hardenedRelease \
            release-artifacts \
            "$RELEASE_CERT_SHA256" \
            "$build_tools" \
            "$version" \
            "$(grep -E '^versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')"
          tdlib_commit="$(grep -oE '[0-9a-fA-F]{40}' build-tools/tdlib/RESOLVED_COMMIT.txt | head -1)"
          cert="$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          evidence_url="${RELEASE_DEVICE_QUALIFICATION_URL:-protected-record}"
          jq -n --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_SHA" --arg version "$version" \
            --arg tdlib "$tdlib_commit" --arg cert "$cert" --arg evidence "$evidence_url" \
            '{tag:$tag, commit:$commit, versionName:$version, tdlibCommit:$tdlib, signingCertificateSha256:$cert, deviceQualificationEvidence:$evidence}' \
            > release-artifacts/RELEASE_MANIFEST.json
          jq empty release-artifacts/RELEASE_MANIFEST.json
          sha256sum release-artifacts/*.apk > release-artifacts/SHA256SUMS.txt
          cp tools/tdlib/BUILD_METADATA.txt release-artifacts/TDLIB_BUILD_METADATA.txt
          cp tools/tdlib/BUILD_VERIFICATION.txt release-artifacts/TDLIB_BUILD_VERIFICATION.txt
          {
            printf '# Bousygram %s\n\n' "$RELEASE_TAG"
            printf -- '- Source commit: `%s`\n' "$RELEASE_SHA"
            printf -- '- TDLib commit: `%s`\n' "$tdlib_commit"
            printf -- '- Device qualification: protected commit-specific record\n'
            printf -- '- Signing certificate: verified against protected `RELEASE_CERT_SHA256`\n'
            printf -- '- APK matrix: ARM32, ARM64, universal\n'
          } > release-artifacts/RELEASE_VERIFICATION.md
          printf 'Bousygram %s hardened release\n' "$RELEASE_TAG" > release-artifacts/RELEASE_NOTES.md

      - name: Archive signed release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          retention-days: 30
          if-no-files-found: error
          path: release-artifacts/

      - name: Remove temporary keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RELEASE_STORE_FILE"

  create-draft:
    name: Create verified draft release
    needs: device-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-draft
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Download signed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: release-artifacts

      - name: Refuse overwrite and create draft
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing overwrite." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "Bousygram $RELEASE_TAG" \
            --notes-file release-artifacts/RELEASE_NOTES.md \
            release-artifacts/Bousygram-*.apk \
            release-artifacts/SHA256SUMS.txt \
            release-artifacts/RELEASE_MANIFEST.json \
            release-artifacts/RELEASE_VERIFICATION.md \
            release-artifacts/TDLIB_BUILD_METADATA.txt \
            release-artifacts/TDLIB_BUILD_VERIFICATION.txt

  publish:
    name: Publish approved release
    needs: create-draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Publish existing draft only
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          gh release edit "$RELEASE_TAG" --draft=false --latest

name: Android Enterprise Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-enterprise-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signing_available: ${{ steps.capabilities.outputs.signing_available }}
      firebase_available: ${{ steps.capabilities.outputs.firebase_available }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - id: capabilities
        name: Detect optional protected jobs
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" && -n "$RELEASE_CERT_SHA256" ]]; then
            echo "signing_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing_available=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$FIREBASE_SERVICE_ACCOUNT" && -n "$FIREBASE_PROJECT_ID" ]]; then
            echo "firebase_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "firebase_available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle checks
        run: >-
          ./gradlew --no-daemon
          :app:verifyTdlibAbiCoverage
          :app:verifyTvHardeningContract
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug
      - name: Archive debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: bousygram-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  hardened-release:
    needs: build
    if: ${{ needs.build.outputs.signing_available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
      RELEASE_STORE_FILE: ${{ github.workspace }}/.ci/bousygram-release.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Restore release keystore
        shell: bash
        run: |
          mkdir -p "$(dirname "$RELEASE_STORE_FILE")"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
      - name: Build hardened release
        run: ./gradlew --no-daemon :app:assembleHardenedRelease
      - name: Verify every release APK signature
        shell: bash
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          EXPECTED="$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          mapfile -t APKS < <(find app/build/outputs/apk/hardenedRelease -maxdepth 1 -type f -name '*.apk' | sort)
          [[ ${#APKS[@]} -gt 0 ]] || { echo 'No hardened release APKs were produced.' >&2; exit 1; }
          for apk in "${APKS[@]}"; do
            "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
            ACTUAL="$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            [[ -n "$ACTUAL" && "$ACTUAL" == "$EXPECTED" ]] || {
              echo "Certificate mismatch for $apk" >&2
              exit 1
            }
          done
      - name: Archive hardened artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bousygram-hardened-release
          path: |
            app/build/outputs/apk/hardenedRelease/*.apk
            app/build/outputs/mapping/hardenedRelease/mapping.txt
            app/build/outputs/native-debug-symbols/hardenedRelease/**
          if-no-files-found: error

  firebase-test-lab:
    needs: build
    if: ${{ needs.build.outputs.firebase_available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build debug and Android tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      - name: Phone smoke test
        shell: bash
        run: |
          APP_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*debug-universal.apk' -print -quit)"
          TEST_APK="$(find app/build/outputs/apk/androidTest/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APP_APK" && -n "$TEST_APK" ]]
          gcloud firebase test android run \
            --type instrumentation \
            --app "$APP_APK" \
            --test "$TEST_APK" \
            --device model=oriole,version=35,locale=en,orientation=portrait \
            --timeout 10m
      - name: Android TV smoke test
        shell: bash
        run: |
          APP_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*debug-universal.apk' -print -quit)"
          TEST_APK="$(find app/build/outputs/apk/androidTest/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APP_APK" && -n "$TEST_APK" ]]
          gcloud firebase test android run \
            --type instrumentation \
            --app "$APP_APK" \
            --test "$TEST_APK" \
            --device model=ADT-3,version=30,locale=en,orientation=landscape \
            --timeout 10m

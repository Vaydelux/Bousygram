name: Android Enterprise Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-enterprise-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: '37'
  BUILD_TOOLS_VERSION: 35.0.0

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install workflow lint tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: Lint workflows and shell scripts
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/android-enterprise.yml .github/workflows/android-release.yml .github/workflows/tdlib-java-generation.yml .github/workflows/android-apk-release.yml .github/workflows/android-emulator-smoke.yml .github/workflows/android-debug-prerelease.yml
          shellcheck tools/ci/*.sh tools/tdlib/*.sh
          bash -n tools/ci/*.sh tools/tdlib/*.sh
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base_sha="$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
            git diff --check "$base_sha...$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi

      - name: Exercise release identity and qualification failure fixtures
        shell: bash
        run: bash tools/ci/test_release_manifest.sh

      - name: Test automated release version policy
        shell: bash
        run: bash tools/ci/test_release_tag_policy.sh

      - name: Validate Gradle wrapper
        shell: bash
        run: bash tools/ci/verify_gradle_wrapper.sh

      - name: Run Gradle wrapper negative fixtures
        shell: bash
        run: bash tools/ci/test_gradle_wrapper_validation.sh

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK dependencies
        shell: bash
        run: bash tools/ci/setup_android_sdk.sh

      - name: Run Android SDK resolver negative fixtures
        shell: bash
        run: bash tools/ci/test_android_sdk_setup.sh

      - name: Run required Gradle verification
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:verifyReleaseVersionPolicy \
            :app:verifyTdlibAbiCoverage \
            :app:verifyTvHardeningContract \
            :app:verifyPrivateMediaCastReleaseGate \
            :app:verifySensitiveLogRedaction \
            :app:verifyTdlibBindingCompatibility \
            :app:compileDebugKotlin \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Normalize and verify debug artifacts
        if: ${{ success() }}
        shell: bash
        run: bash tools/ci/verify_debug_artifacts.sh

      - name: Archive verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verification-reports-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            tools/tdlib/BUILD_METADATA.txt
            tools/tdlib/BUILD_VERIFICATION.txt
            build-tools/tdlib/RESOLVED_COMMIT.txt

      - name: Archive debug APKs
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: ci-artifacts/debug/


  verify-debug-preview-matrix:
    name: Verify debug APK ABI matrix
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK dependencies
        shell: bash
        run: bash tools/ci/setup_android_sdk.sh

      - name: Build all supported debug APK architectures
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          CI_VERIFICATION_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash tools/ci/build_debug_preview.sh ci-artifacts/debug-preview
          ( cd ci-artifacts/debug-preview && sha256sum --check SHA256SUMS.txt )
          [[ "$(find ci-artifacts/debug-preview -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 3 ]]

      - name: Archive validated debug APK matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-preview-apks-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: ci-artifacts/debug-preview/

  firebase-not-configured:
    name: Firebase Test Lab not configured
    needs: build
    if: ${{ always() && vars.FIREBASE_TEST_LAB_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record explicit NOT CONFIGURED status
        run: |
          {
            echo '## Firebase Test Lab'
            echo ''
            echo 'NOT CONFIGURED: set FIREBASE_TEST_LAB_ENABLED=true and the protected authentication/device variables to enable this job.'
          } >> "$GITHUB_STEP_SUMMARY"

  firebase-test-lab:
    name: Firebase Test Lab instrumentation
    needs: build
    if: ${{ vars.FIREBASE_TEST_LAB_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      FIREBASE_PHONE_MODEL: ${{ vars.FIREBASE_PHONE_MODEL }}
      FIREBASE_PHONE_VERSION: ${{ vars.FIREBASE_PHONE_VERSION }}
      FIREBASE_TV_MODEL: ${{ vars.FIREBASE_TV_MODEL }}
      FIREBASE_TV_VERSION: ${{ vars.FIREBASE_TV_VERSION }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Authenticate with Workload Identity Federation
        if: ${{ vars.FIREBASE_AUTH_MODE == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate with protected service account fallback
        if: ${{ vars.FIREBASE_AUTH_MODE == 'json' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Download verified debug APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-apks-${{ github.sha }}
          path: ci-artifacts/debug

      - name: Validate configured Firebase devices
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?GCP_PROJECT_ID is required}"
          : "${FIREBASE_PHONE_MODEL:?FIREBASE_PHONE_MODEL is required}"
          : "${FIREBASE_PHONE_VERSION:?FIREBASE_PHONE_VERSION is required}"
          : "${FIREBASE_TV_MODEL:?FIREBASE_TV_MODEL is required}"
          : "${FIREBASE_TV_VERSION:?FIREBASE_TV_VERSION is required}"
          gcloud firebase test android models describe "$FIREBASE_PHONE_MODEL" --version "$FIREBASE_PHONE_VERSION" --project "$GCP_PROJECT_ID" >/dev/null
          gcloud firebase test android models describe "$FIREBASE_TV_MODEL" --version "$FIREBASE_TV_VERSION" --project "$GCP_PROJECT_ID" >/dev/null

      - name: Run phone instrumentation
        shell: bash
        run: |
          gcloud firebase test android run \
            --project "$GCP_PROJECT_ID" \
            --type instrumentation \
            --app ci-artifacts/debug/Bousygram-debug.apk \
            --test ci-artifacts/debug/Bousygram-debug-androidTest.apk \
            --device model="$FIREBASE_PHONE_MODEL",version="$FIREBASE_PHONE_VERSION",locale=en,orientation=portrait \
            --timeout 10m

      - name: Run Android TV instrumentation
        shell: bash
        run: |
          gcloud firebase test android run \
            --project "$GCP_PROJECT_ID" \
            --type instrumentation \
            --app ci-artifacts/debug/Bousygram-debug.apk \
            --test ci-artifacts/debug/Bousygram-debug-androidTest.apk \
            --device model="$FIREBASE_TV_MODEL",version="$FIREBASE_TV_VERSION",locale=en,orientation=landscape \
            --timeout 10m

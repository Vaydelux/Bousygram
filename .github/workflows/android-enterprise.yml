name: Android Enterprise Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-enterprise-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: '37'
  BUILD_TOOLS_VERSION: 35.0.0

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify mascot, launcher and favicon use canonical brand
        shell: bash
        run: bash tools/ci/verify_brand_identity.sh

      - name: Install workflow lint tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: Lint workflows and shell scripts
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
          shellcheck tools/ci/*.sh tools/tdlib/*.sh
          bash -n tools/ci/*.sh tools/tdlib/*.sh
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base_sha="$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
            git diff --check "$base_sha...$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi

      - name: Validate Windows device and playback profiling tool syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            "tools/qualification/Capture-BousygramDevice.ps1",
            "tools/qualification/Capture-BousygramPlaybackPerf.ps1",
            "tools/qualification/Capture-BousygramPhysicalSoak.ps1",
            "tools/qualification/Parse-BousygramDataSpace.ps1",
            "tools/ci/Test-BousygramDataSpaceParser.ps1",
            "tools/qualification/Compare-BousygramPhysicalSoak.ps1",
            "tools/ci/Test-BousygramPhysicalSoakComparator.ps1",
            "tools/qualification/Compare-BousygramPlaybackPerf.ps1",
            "tools/qualification/Capture-BousygramExtrasPerf.ps1",
            "tools/qualification/Compare-BousygramExtrasPerf.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $_" }
              exit 1
            }
          }
          & pwsh -NoProfile -File tools/ci/Test-BousygramPlaybackPerfComparator.ps1
          & pwsh -NoProfile -File tools/ci/Test-BousygramPhysicalSoakComparator.ps1
          & pwsh -NoProfile -File tools/ci/Test-BousygramDataSpaceParser.ps1

      - name: Validate sanitized multi-run hardware evidence parsing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/qualification/compare_physical_cohorts.py tools/ci/test_physical_cohort_comparison.py
          python3 -m unittest discover -s tools/ci -p 'test_physical_cohort_comparison.py' -v
          python3 -m py_compile tools/qualification/compare_audio_processing.py tools/ci/test_audio_processing_comparator.py
          python3 -m unittest discover -s tools/ci -p 'test_audio_processing_comparator.py' -v
          # Synthetic fixtures are exclusively test data. This job has no
          # authenticated device, no physical PSS and no release-approval path.

      - name: Verify favorites migration and bounded storage queries
        run: python3 tools/ci/test_favorites_storage.py

      - name: Exercise release identity and qualification failure fixtures
        shell: bash
        run: bash tools/ci/test_release_manifest.sh

      - name: Test automated release version policy
        shell: bash
        run: bash tools/ci/test_release_tag_policy.sh

      - name: Test prerelease source identity and APK checksum failures
        shell: bash
        run: bash tools/ci/test_debug_preview_publication.sh

      - name: Verify authenticated debug release reference fixtures
        shell: bash
        run: bash tools/ci/test_debug_release_refs.sh

      - name: Verify branch archive/prune policy fixtures
        shell: bash
        run: bash tools/ci/test_branch_prune_policy.sh

      - name: Test deterministic UTC debug prerelease tags
        shell: bash
        run: |
          bash tools/ci/test_debug_prerelease_tag.sh
          bash tools/ci/test_debug_emulator_gate.sh

      # The pinned wrapper's runtime verification invokes Java. Provision the
      # explicit supported JDK first; ubuntu-latest may change default Java.
      # Wrapper file/hash integrity and negative fixtures are still required.
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        shell: bash
        run: bash tools/ci/verify_gradle_wrapper.sh

      - name: Run Gradle wrapper negative fixtures
        shell: bash
        run: bash tools/ci/test_gradle_wrapper_validation.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK dependencies
        shell: bash
        run: bash tools/ci/setup_android_sdk.sh

      - name: Run Android SDK resolver negative fixtures
        shell: bash
        run: bash tools/ci/test_android_sdk_setup.sh

      - name: Refuse manually dispatched debug builds outside main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo '::error::Credentialed Android debug builds must be dispatched from main.' >&2
          exit 1

      # API keys are never exposed to pull_request builds. Only trusted manual
      # workflow dispatches and pushes to main may bake TMDB v3 into debug APKs.
      # APK contents are publicly inspectable: this protects CI storage, not the key.
      - name: Configure TMDB v3 API key for trusted debug builds
        if: ${{ github.ref == 'refs/heads/main' && github.repository == 'Vaydelux/Bousygram' }}
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          # Trusted APKs must never silently ship an empty or placeholder
          # credential. Verify the v3 API key without printing its value.
          if [[ ! "$TMDB_API_KEY" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "::error::Trusted debug APK requires a TMDB_API_KEY secret containing a 32-character TMDB v3 API key."
            exit 1
          fi
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > .env
          chmod 600 .env

      - name: Run required Gradle verification
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            :app:verifyReleaseVersionPolicy \
            :app:verifyTdlibAbiCoverage \
            :app:verifyTvHardeningContract \
            :app:verifyPrivateMediaCastReleaseGate \
            :app:verifySensitiveLogRedaction \
            :app:verifyTdlibBindingCompatibility \
            :app:compileDebugKotlin \
            :mediaforge-core:testDebugUnitTest \
            :mediaforge-player-adapters:testDebugUnitTest \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Verify exported Room v3 schema and migration contract
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          schema_dir=app/schemas/com.vaydelux.bousygram.data.database.AppDatabase
          test -s "$schema_dir/3.json" || {
            echo "::error::Room v3 favorites schema export missing." >&2
            exit 1
          }
          # This repository has never tracked a v2 export. Do not claim it exists
          # or invent a Room identity hash; verify the real 2->3 SQL and v3 schema.
          if [[ ! -s "$schema_dir/2.json" ]]; then
            echo "::notice::Historical Room v2 export was never committed; using the 2->3 SQL/schema contract and Android migration tests."
          fi
          python3 tools/ci/test_favorites_storage.py
          git diff --exit-code -- "$schema_dir/3.json" || {
            echo "::error::Room v3 exported schema diverges from checked-in migration contract." >&2
            exit 1
          }

      - name: Normalize and verify debug artifacts
        if: ${{ success() }}
        shell: bash
        run: bash tools/ci/verify_debug_artifacts.sh

      - name: Archive verification reports only on failure
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verification-reports-${{ github.sha }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            mediaforge-core/build/test-results/testDebugUnitTest/**/*.xml
            mediaforge-player-adapters/build/test-results/testDebugUnitTest/**/*.xml
            mediaforge-core/build/reports/tests/testDebugUnitTest/**
            app/schemas/**/*.json
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            tools/tdlib/BUILD_METADATA.txt
            tools/tdlib/BUILD_VERIFICATION.txt
            build-tools/tdlib/RESOLVED_COMMIT.txt

      # Debug prereleases build an independent three-ABI matrix and publish
      # to GitHub Releases directly; no automatic APK uploads per commit.
      - name: Archive APKs only for configured Firebase Test Lab
        if: ${{ success() && vars.FIREBASE_TEST_LAB_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: ci-artifacts/debug/


  # Duplicate per-push ABI preview and idle Firebase status jobs retired.
  # An explicitly dispatched debug release builds/verifies all three ABI APKs.

  firebase-test-lab:
    name: Firebase Test Lab instrumentation
    needs: build
    if: ${{ vars.FIREBASE_TEST_LAB_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      FIREBASE_PHONE_MODEL: ${{ vars.FIREBASE_PHONE_MODEL }}
      FIREBASE_PHONE_VERSION: ${{ vars.FIREBASE_PHONE_VERSION }}
      FIREBASE_TV_MODEL: ${{ vars.FIREBASE_TV_MODEL }}
      FIREBASE_TV_VERSION: ${{ vars.FIREBASE_TV_VERSION }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Authenticate with Workload Identity Federation
        if: ${{ vars.FIREBASE_AUTH_MODE == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate with protected service account fallback
        if: ${{ vars.FIREBASE_AUTH_MODE == 'json' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Download verified debug APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-apks-${{ github.sha }}
          path: ci-artifacts/debug

      - name: Validate configured Firebase devices
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?GCP_PROJECT_ID is required}"
          : "${FIREBASE_PHONE_MODEL:?FIREBASE_PHONE_MODEL is required}"
          : "${FIREBASE_PHONE_VERSION:?FIREBASE_PHONE_VERSION is required}"
          : "${FIREBASE_TV_MODEL:?FIREBASE_TV_MODEL is required}"
          : "${FIREBASE_TV_VERSION:?FIREBASE_TV_VERSION is required}"
          gcloud firebase test android models describe "$FIREBASE_PHONE_MODEL" --version "$FIREBASE_PHONE_VERSION" --project "$GCP_PROJECT_ID" >/dev/null
          gcloud firebase test android models describe "$FIREBASE_TV_MODEL" --version "$FIREBASE_TV_VERSION" --project "$GCP_PROJECT_ID" >/dev/null

      - name: Run phone instrumentation
        shell: bash
        run: |
          gcloud firebase test android run \
            --project "$GCP_PROJECT_ID" \
            --type instrumentation \
            --app ci-artifacts/debug/Bousygram-debug.apk \
            --test ci-artifacts/debug/Bousygram-debug-androidTest.apk \
            --device model="$FIREBASE_PHONE_MODEL",version="$FIREBASE_PHONE_VERSION",locale=en,orientation=portrait \
            --timeout 10m

      - name: Run Android TV instrumentation
        shell: bash
        run: |
          gcloud firebase test android run \
            --project "$GCP_PROJECT_ID" \
            --type instrumentation \
            --app ci-artifacts/debug/Bousygram-debug.apk \
            --test ci-artifacts/debug/Bousygram-debug-androidTest.apk \
            --device model="$FIREBASE_TV_MODEL",version="$FIREBASE_TV_VERSION",locale=en,orientation=landscape \
            --timeout 10m

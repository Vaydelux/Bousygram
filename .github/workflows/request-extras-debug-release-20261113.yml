name: Request verified Extras debug release (2026-11-13)

# Historical one-time request. Auto-dispatch is permanently retired:
# editing this file must NEVER publish another debug GitHub release.
# Explicit manual dispatch remains available if requested by the owner.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-debug-release:
    name: Request exact-main verified debug prerelease
    if: github.repository == 'Vaydelux/Bousygram' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify latest main and merged Extras fixes, then dispatch release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          current="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current" == "$GITHUB_SHA" ]] || {
            echo "::error::main moved; refuse to publish a stale debug source."
            exit 1
          }
          merged="$(gh api "repos/$repo/pulls/185" --jq '.merged')"
          [[ "$merged" == true ]] || {
            echo "::error::Required Extras PR #185 is not merged."
            exit 1
          }
          gh api --method POST "repos/$repo/actions/workflows/android-debug-prerelease.yml/dispatches" --raw-field ref=main
          {
            echo "## Requested qualified debug APK release"
            echo "Source commit: $GITHUB_SHA"
            echo "Publishing workflow: android-debug-prerelease.yml"
            echo "This produces ARM32, ARM64 and universal debug APKs with checksum verification."
            echo "The previously retained GitHub Release is not deleted or replaced."
          } >> "$GITHUB_STEP_SUMMARY"

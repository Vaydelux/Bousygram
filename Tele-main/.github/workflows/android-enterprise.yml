name: Android Enterprise Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Gradle checks
        run: |
          ./gradlew --no-daemon :app:verifyTdlibAbiCoverage
          ./gradlew --no-daemon :app:lintDebug
          ./gradlew --no-daemon :app:testDebugUnitTest
          ./gradlew --no-daemon :app:assembleDebug
          ./gradlew --no-daemon :app:assembleHardenedRelease
      - name: Verify APK signature
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/hardenedRelease/app-hardenedRelease.apk
      - name: Archive hardened artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bousygram-hardened-release
          path: |
            app/build/outputs/apk/hardenedRelease/*.apk
            app/build/outputs/mapping/hardenedRelease/mapping.txt
            app/build/outputs/native-debug-symbols/hardenedRelease/**
          if-no-files-found: ignore

  firebase-test-lab:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Build debug and android tests
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Authenticate Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-service-account.json"
          gcloud config set project '${{ secrets.FIREBASE_PROJECT_ID }}'
      - name: Phone smoke test
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=oriole,version=35,locale=en,orientation=portrait \
            --timeout 10m
      - name: Android TV smoke test
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=ADT-3,version=30,locale=en,orientation=landscape \
            --timeout 10m
